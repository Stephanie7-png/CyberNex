services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
    ports:
      - "8000:8000"
    volumes:
      - api-data:/data
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  api-data:
