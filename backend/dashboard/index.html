<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>CyberNex - Supervision</title>

<style>

:root {
  --bg: #0b1220;
  --card: #131c2e;
  --txt: #e2e8f0;
  --mut: #94a3b8;
  --ok: #22c55e;
  --warn: #f59e0b;
  --crit: #ef4444;
  --acc: #38bdf8;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--bg);
  color: var(--txt);
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 14px 20px;

  border-bottom:
    1px solid #1e293b;
}

h1 {
  margin: 0;
  font-size: 22px;
}

.badge {
  padding: 5px 10px;

  border-radius: 999px;

  font-size: 13px;

  background: #334155;
}

.badge.on {
  background: var(--ok);
  color: #052e16;
}

.badge.off {
  background: var(--crit);
}

main {

  display: grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(320px, 1fr)
    );

  gap: 14px;

  padding: 16px;
}

.card {

  background: var(--card);

  border-radius: 10px;

  padding: 14px;
}

.card h2 {

  margin:
    0
    0
    10px;

  font-size: 15px;

  color: var(--mut);

  font-weight: 600;
}

canvas {

  width: 100%;

  height: 130px;

  display: block;
}

button {

  padding:
    8px
    14px;

  margin:
    4px
    4px
    4px
    0;

  border: 0;

  border-radius: 6px;

  cursor: pointer;

  background: #1e3a5f;

  color: var(--txt);
}

button:hover {
  background: #2a4f80;
}

button.off {
  background: #3b2230;
}

input {

  padding: 8px;

  border-radius: 6px;

  border:
    1px solid #334155;

  background: #0b1220;

  color: var(--txt);

  width: 100%;

  margin-bottom: 8px;
}

ul {

  list-style: none;

  margin: 0;

  padding: 0;

  max-height: 300px;

  overflow: auto;
}

li {

  padding:
    7px
    8px;

  margin-bottom: 4px;

  border-radius: 6px;

  background: #0f172a;

  border-left:
    4px solid var(--mut);

  font-size: 13px;
}

li.warning {
  border-color: var(--warn);
}

li.critical {
  border-color: var(--crit);
}

li.info {
  border-color: var(--acc);
}

.pir {

  display: inline-block;

  width: 12px;

  height: 12px;

  border-radius: 50%;

  background: #334155;

  margin-right: 6px;
}

.pir.on {
  background: var(--crit);
}

#msg {

  font-size: 13px;

  color: var(--mut);

  min-height: 20px;

  margin-top: 8px;
}

.camera-placeholder {

  min-height: 150px;

  border-radius: 6px;

  background: #020617;

  display: flex;

  align-items: center;

  justify-content: center;

  color: var(--mut);

  text-align: center;
}

</style>

</head>

<body>

<header>

  <h1>CyberNex — Supervision</h1>

  <div>

    <span
      id="ws"
      class="badge off"
    >
      WebSocket
    </span>

    <span
      id="dev"
      class="badge off"
    >
      Boîtier hors ligne
    </span>

  </div>

</header>


<main>

  <!-- TEMPERATURE -->

  <div class="card">

    <h2>
      Température (°C)
    </h2>

    <canvas
      id="c-temp"
      width="400"
      height="130"
    ></canvas>

  </div>


  <!-- HUMIDITE -->

  <div class="card">

    <h2>
      Humidité (%)
    </h2>

    <canvas
      id="c-hum"
      width="400"
      height="130"
    ></canvas>

  </div>


  <!-- GAZ -->

  <div class="card">

    <h2>
      Gaz / Fumées (MQ-2)
    </h2>

    <canvas
      id="c-gas"
      width="400"
      height="130"
    ></canvas>

  </div>


  <!-- PRESENCE -->

  <div class="card">

    <h2>

      <span
        id="pir"
        class="pir"
      ></span>

      Détecteur de présence (PIR)

    </h2>

    <p id="pirtxt">
      Aucune présence
    </p>

  </div>


  <!-- CAMERA -->

  <div class="card">

  <h2>
    Caméra / analyse IA
  </h2>

  <img
    id="cam"
    alt="Flux caméra CyberNex"
    style="
      width:100%;
      min-height:240px;
      object-fit:cover;
      background:#020617;
      border-radius:6px;
    "
  >

   </div>


  <!-- COMMANDES -->

  <div class="card">

    <h2>
      Panneau de contrôle
    </h2>

    <input
      id="key"
      type="password"
      placeholder="Clé API (X-API-Key)"
      autocomplete="off"
    >

    <div>

      <button
        onclick="cmd('buzzer', true)"
      >
         Buzzer ON
      </button>

      <button
        class="off"
        onclick="cmd('buzzer', false)"
      >
        Buzzer OFF
      </button>

      <br>

      <button
        onclick="cmd('led_red', true)"
      >
         LED ON
      </button>

      <button
        class="off"
        onclick="cmd('led_red', false)"
      >
        LED OFF
      </button>

    </div>

    <div id="msg"></div>

  </div>


  <!-- ALERTES -->

  <div
    class="card"
    style="grid-column:1/-1"
  >

    <h2>
      Alertes récentes
    </h2>

    <ul id="alerts"></ul>

  </div>

</main>


<script>

const MAX = 60;

const series = {
  temp: [],
  hum: [],
  gas: []
};

const colors = {
  temp: '#f97316',
  hum: '#38bdf8',
  gas: '#a3e635'
};

let lastMetric = 0;


// =====================================================
// GRAPHIQUES
// =====================================================

function draw(key) {

  const cv =
    document.getElementById(
      'c-' + key
    );

  const c =
    cv.getContext('2d');

  const d =
    series[key];

  c.clearRect(
    0,
    0,
    cv.width,
    cv.height
  );

  if (d.length < 2) {
    return;
  }

  const min =
    Math.min(...d);

  const max =
    Math.max(...d);

  const range =
    (max - min) || 1;

  c.strokeStyle =
    colors[key];

  c.lineWidth = 2;

  c.beginPath();

  d.forEach(
    (value, index) => {

      const x =
        index /
        (d.length - 1) *
        cv.width;

      const y =
        cv.height -
        10 -
        (value - min) /
        range *
        (cv.height - 36);

      if (index) {

        c.lineTo(
          x,
          y
        );

      } else {

        c.moveTo(
          x,
          y
        );
      }
    }
  );

  c.stroke();

  c.fillStyle =
    '#e2e8f0';

  c.font =
    '14px sans-serif';

  c.fillText(
    'Actuel : ' +
    d[d.length - 1].toFixed(1) +
    '   (min ' +
    min.toFixed(1) +
    ' / max ' +
    max.toFixed(1) +
    ')',
    6,
    16
  );
}


// =====================================================
// METRIQUES
// =====================================================

function addMetric(m) {

  for (
    const key
    of ['temp', 'hum', 'gas']
  ) {

    if (
      m[key] !== null &&
      m[key] !== undefined
    ) {

      series[key].push(
        m[key]
      );

      if (
        series[key].length > MAX
      ) {

        series[key].shift();
      }

      draw(key);
    }
  }

  document
    .getElementById('pir')
    .classList
    .toggle(
      'on',
      !!m.pir
    );

  document
    .getElementById('pirtxt')
    .textContent =
      m.pir
        ? 'Présence détectée !'
        : 'Aucune présence';

  lastMetric =
    Date.now();
}


// =====================================================
// ALERTES
// =====================================================

function addAlert(
  alert,
  prepend = true
) {

  const li =
    document.createElement('li');

  li.className =
    alert.level || 'info';

  const time =
    new Date(
      (
        alert.ts ||
        Date.now() / 1000
      ) * 1000
    )
    .toLocaleTimeString();

  li.textContent =
    `[${time}] ` +
    `${String(alert.level).toUpperCase()} • ` +
    `${alert.device} • ` +
    `${alert.type}` +

    (
      alert.value != null
        ? ` = ${alert.value}`
        : ''
    ) +

    (
      alert.message
        ? ` — ${alert.message}`
        : ''
    );

  const ul =
    document.getElementById(
      'alerts'
    );

  if (prepend) {

    ul.prepend(li);

  } else {

    ul.append(li);
  }

  while (
    ul.children.length > 50
  ) {

    ul.lastChild.remove();
  }
}


// =====================================================
// WEBSOCKET
// =====================================================

function connect() {

  const protocol =
    location.protocol === 'https:'
      ? 'wss://'
      : 'ws://';

  const ws =
    new WebSocket(
      protocol +
      location.host +
      '/ws'
    );

  const badge =
    document.getElementById(
      'ws'
    );

  ws.onopen = () => {

    badge.className =
      'badge on';

    setInterval(
      () => {

        if (
          ws.readyState === 1
        ) {

          ws.send('ping');
        }

      },
      20000
    );
  };

  ws.onclose = () => {

    badge.className =
      'badge off';

    setTimeout(
      connect,
      2000
    );
  };

  ws.onmessage = (event) => {

    const message =
      JSON.parse(
        event.data
      );

    if (
      message.kind === 'metric'
    ) {

      addMetric(message);

    } else if (
      message.kind === 'alert'
    ) {

      addAlert(message);
    }
  };
}


// =====================================================
// COMMANDES
// =====================================================

async function cmd(
  target,
  state
) {

  const message =
    document.getElementById(
      'msg'
    );

  const key =
    document.getElementById(
      'key'
    ).value;

  if (!key) {

    message.textContent =
      'Veuillez saisir la clé API.';

    return;
  }

  try {

    const response =
      await fetch(
        '/api/v1/commands',
        {

          method: 'POST',

          headers: {

            'Content-Type':
              'application/json',

            'X-API-Key':
              key
          },

          body:
            JSON.stringify({
              target,
              state
            })
        }
      );

    if (response.ok) {

      message.textContent =
        `Commande envoyée : ` +
        `${target} → ` +
        `${state ? 'ON' : 'OFF'}`;

    } else if (
      response.status === 401
    ) {

      message.textContent =
        'Clé API incorrecte.';

    } else {

      message.textContent =
        `Erreur ${response.status}`;
    }

  } catch (error) {

    message.textContent =
      'API injoignable';
  }
}


// =====================================================
// INITIALISATION
// =====================================================

async function init() {

  try {

    const metrics =
      await (
        await fetch(
          '/api/v1/metrics?limit=60'
        )
      ).json();

    metrics.forEach(
      addMetric
    );

    const alerts =
      await (
        await fetch(
          '/api/v1/alerts?limit=20'
        )
      ).json();

    alerts
      .reverse()
      .forEach(
        alert =>
          addAlert(alert)
      );

  } catch (error) {

    console.log(
      'Erreur chargement initial',
      error
    );
  }

  connect();

  setInterval(
    () => {

      const online =
        Date.now() -
        lastMetric <
        15000;

      const badge =
        document.getElementById(
          'dev'
        );

      badge.className =
        'badge ' +
        (
          online
            ? 'on'
            : 'off'
        );

      badge.textContent =
        online
          ? 'Boîtier en ligne'
          : 'Boîtier hors ligne';
              // Mise à jour caméra IA
        const cam =
           document.getElementById('cam');

      cam.src =
           '/api/v1/frame?t=' +
           Date.now();


    },
    1000
  );
}


init();

</script>

</body>

</html>
